<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 254" width="264" height="254" role="img" aria-label="小狗团团">
  <!-- pet: dog ｜ 垂耳画在 head 之后（ear-front），眼镜图层更后，因此戴眼镜时不遮镜片 -->
  <g data-layer="background"></g>
  <ellipse data-layer="shadow" cx="132" cy="236" rx="68" ry="11" fill="rgba(122,74,36,0.14)" />

  <g data-layer="tail">
    <path d="M176 198c26 0 36-16 30-34" fill="none" stroke="#8a5f33" stroke-width="22" stroke-linecap="round" />
    <path d="M176 198c26 0 36-16 30-34" fill="none" stroke="#e9b978" stroke-width="14" stroke-linecap="round" />
    <path d="M200 170c4-4 6-9 6-13" fill="none" stroke="#ffeed4" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <g data-layer="body">
    <ellipse cx="132" cy="180" rx="63" ry="53" fill="#e9b978" stroke="#8a5f33" stroke-width="7" />
    <ellipse cx="132" cy="192" rx="40" ry="34" fill="#ffeed4" />
    <path d="M96 156c2-10 10-16 19-15" fill="none" stroke="#c9945a" stroke-width="6" stroke-linecap="round" opacity="0.5" />
    <path d="M170 160c-2-9-9-14-17-14" fill="none" stroke="#c9945a" stroke-width="6" stroke-linecap="round" opacity="0.5" />
    <ellipse cx="106" cy="218" rx="20" ry="12.5" fill="#ffeed4" stroke="#8a5f33" stroke-width="6" />
    <ellipse cx="158" cy="218" rx="20" ry="12.5" fill="#ffeed4" stroke="#8a5f33" stroke-width="6" />
    <path d="M112 216v4M120 216v4M150 216v4M158 216v4" stroke="#d0a877" stroke-width="2.6" stroke-linecap="round" />
  </g>

  <g data-layer="outfit"></g>

  <g data-layer="ear-left"></g>
  <g data-layer="ear-right"></g>

  <g data-layer="head">
    <ellipse cx="132" cy="104" rx="65" ry="57" fill="#e9b978" stroke="#8a5f33" stroke-width="7" />

    <g data-layer="face">
      <ellipse cx="88" cy="134" rx="14" ry="8.5" fill="#ff9e9e" opacity="0.4" />
      <ellipse cx="176" cy="134" rx="14" ry="8.5" fill="#ff9e9e" opacity="0.4" />

      <g data-layer="eye-left">
        <ellipse cx="108" cy="104" rx="10" ry="12" fill="#3d2a1c" />
        <circle cx="104.6" cy="99" r="3.5" fill="#ffffff" />
        <circle cx="111.4" cy="108" r="1.8" fill="#ffffff" opacity="0.75" />
      </g>
      <g data-layer="eye-right">
        <ellipse cx="156" cy="104" rx="10" ry="12" fill="#3d2a1c" />
        <circle cx="152.6" cy="99" r="3.5" fill="#ffffff" />
        <circle cx="159.4" cy="108" r="1.8" fill="#ffffff" opacity="0.75" />
      </g>

      <ellipse cx="132" cy="128" rx="27" ry="19" fill="#ffeed4" />
      <ellipse cx="132" cy="117" rx="9.5" ry="7" fill="#3d2a1c" />
      <path d="M132 124v4" stroke="#8a5f33" stroke-width="3.2" stroke-linecap="round" />
      <path d="M132 128c-3.6 4.6-10 4.4-13 0.6M132 128c3.6 4.6 10 4.4 13 0.6" fill="none" stroke="#8a5f33" stroke-width="3.2" stroke-linecap="round" />
      <path d="M126 134c0 11 12 11 12 0 0-2-3-3-6-3s-6 1-6 3Z" fill="#ff8f9e" />
    </g>
  </g>

  <g data-layer="ear-left-front">
    <ellipse cx="70" cy="104" rx="19" ry="33" fill="#c98f4e" stroke="#8a5f33" stroke-width="7" transform="rotate(13 70 104)" />
  </g>
  <g data-layer="ear-right-front">
    <ellipse cx="194" cy="104" rx="19" ry="33" fill="#c98f4e" stroke="#8a5f33" stroke-width="7" transform="rotate(-13 194 104)" />
  </g>

  <g data-layer="scarf"></g>
  <g data-layer="glasses"></g>
  <g data-layer="hat"></g>

  <g data-layer="spark" opacity="0.9">
    <path d="M28 96c.9 5.4 2.7 7.2 8.1 8.1-5.4.9-7.2 2.7-8.1 8.1-.9-5.4-2.7-7.2-8.1-8.1 5.4-.9 7.2-2.7 8.1-8.1Z" fill="#ffc531" />
    <path d="M238 138c.7 4 2 5.4 6 6.1-4 .7-5.3 2-6 6.1-.7-4-2-5.4-6-6.1 4-.7 5.3-2.1 6-6.1Z" fill="#4c9aff" opacity="0.55" />
  </g>
</svg>
